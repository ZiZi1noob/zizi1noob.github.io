<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Cap top highlight -->
  <rect x="4" y="0" width="9" height="1" fill="#FF4444"/>
  <rect x="4" y="1" width="9" height="1" fill="#E52521"/>
  <!-- Cap body -->
  <rect x="2" y="2" width="13" height="2" fill="#E52521"/>
  <rect x="1" y="4" width="15" height="2" fill="#E52521"/>
  <rect x="0" y="6" width="17" height="2" fill="#E52521"/>
  <!-- Cap bottom rim -->
  <rect x="1" y="8" width="15" height="1" fill="#C21807"/>
  <!-- White spots -->
  <rect x="6" y="2" width="3" height="2" fill="#FFF"/>
  <rect x="3" y="4" width="3" height="2" fill="#FFF"/>
  <rect x="11" y="4" width="3" height="2" fill="#FFF"/>
  <!-- Eyes (big pixel cute) -->
  <rect x="4" y="8" width="2" height="2" fill="#000"/>
  <rect x="11" y="8" width="2" height="2" fill="#000"/>
  <!-- Eye highlights -->
  <rect x="5" y="8" width="1" height="1" fill="#FFF"/>
  <rect x="12" y="8" width="1" height="1" fill="#FFF"/>
  <!-- Stem -->
  <rect x="4" y="10" width="8" height="2" fill="#FBB040"/>
  <rect x="3" y="12" width="10" height="2" fill="#FBB040"/>
  <rect x="5" y="14" width="6" height="2" fill="#E8A020"/>
</svg>
