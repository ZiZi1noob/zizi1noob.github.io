<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" class="data-source__ai-icon" aria-hidden="true">
  <defs>
    <style>
      .data-source__ai-icon { color: #fff; }
      .ai-bot-shape { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .ai-bot-eye { fill: currentColor; }
      .ai-bot-scan { fill: none; stroke: currentColor; stroke-width: 1.2; stroke-linecap: round; opacity: 0.6; }
    </style>
  </defs>
  <g>
    <rect class="ai-bot-shape" x="5" y="7" width="14" height="12" rx="3" />
    <path class="ai-bot-shape" d="M9 4h6M12 4v3" />
    <circle class="ai-bot-eye" cx="9.5" cy="12" r="1.6">
      <animate attributeName="opacity" values="1;0.3;1" dur="0.6s" begin="indefinite" fill="remove" />
      <animate attributeName="r" values="1.6;2.3;1.6" dur="0.6s" begin="indefinite" fill="remove" />
    </circle>
    <circle class="ai-bot-eye" cx="14.5" cy="12" r="1.6">
      <animate attributeName="opacity" values="1;0.3;1" dur="0.6s" begin="indefinite" fill="remove" />
      <animate attributeName="r" values="1.6;2.3;1.6" dur="0.6s" begin="indefinite" fill="remove" />
    </circle>
    <line class="ai-bot-scan" x1="6" y1="16" x2="18" y2="16">
      <animate attributeName="y1" values="16;10;16" dur="0.7s" begin="indefinite" fill="remove" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" />
      <animate attributeName="y2" values="16;10;16" dur="0.7s" begin="indefinite" fill="remove" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" />
