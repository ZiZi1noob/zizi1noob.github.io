<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZIYANG Resume</title>
<meta name="Ziyang ZHAN Resume" content="Ziyang ZHAN Resume">

<!-- Google Fonts: pixel fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

<body>

<a href="#main" class="skip">Skip to content</a>

<!-- Sticky nav -->
<header class="nav">
  <div class="wrap nav-inner">
    <a href="#about" class="logo" aria-label="Ziyang House"><span id="logoText"></span></a>
    <nav aria-label="Primary">
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">≡</button>
      <ul class="nav-links" id="navLinks"></ul>
    </nav>
  </div>
</header>

<div id="errorBanner" role="alert"></div>

<main id="main">
  <!-- Sections are rendered from data.json by app.js logic below.
       About Me now lives at the top (replacing the old Hero). -->
  <div id="aboutMount"></div>
  <div id="timelineMount"></div>
  <div id="skillsMount"></div>
  <div id="contactMount"></div>
</main>

<footer class="foot" id="footerMount"></footer>

<script>
(function(){
  'use strict';

  /* ---------- tiny helpers ---------- */
  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }
  // rich text — escapes everything except <a> hyperlinks, so you can write
  // <a href='...' target='_blank'>text</a> directly in data.json
  function rich(s){
    var str = String(s == null ? '' : s);
    var links = [];
    var safe = str.replace(/<a\b[^>]*>[\s\S]*?<\/a>/gi, function(m){
      links.push(m);
      return '\x00A'+(links.length-1)+'\x00';
    });
    safe = safe.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    safe = safe.replace(/\x00A(\d+)\x00/g, function(_, idx){
      return links[parseInt(idx)];
    });
    return safe;
  }
  // rich() + tech-stack highlighting (preserves both <a> and <span class="hl">)
  function richWithHL(s, highlights){
    var str = String(s == null ? '' : s);
    if (highlights && highlights.length){
      // sort longest first so e.g. "Federated Learning" beats "Learning"
      var sorted = highlights.slice().sort(function(a,b){ return b.length - a.length; });
      sorted.forEach(function(h){
        var escaped = h.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        var re = new RegExp('\\b(' + escaped + ')\\b', 'gi');
        str = str.replace(re, '<span class="hl">$1</span>');
      });
    }
    var links = [];
    var safe = str.replace(/<(a|span)\b[^>]*>[\s\S]*?<\/\1>/gi, function(m){
      links.push(m);
      return '\x00T'+(links.length-1)+'\x00';
    });
    safe = safe.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    safe = safe.replace(/\x00T(\d+)\x00/g, function(_, idx){
      return links[parseInt(idx)];
    });
    return safe;
  }

  /* ---------- render functions ---------- */
  function renderNav(d){
    var lt = document.getElementById('logoText');
    if (lt) lt.textContent = d.site;
    document.title = d.site + ' · Portfolio';
    document.getElementById('navLinks').innerHTML = d.nav.map(function(n){
      return '<li><a href="'+esc(n.href)+'">'+esc(n.label)+'</a></li>';
    }).join('');
  }
    function renderAbout(d){
    var a = d.about;
    var paras = a.paragraphs.map(function(p){ return '<p>'+rich(p)+'</p>'; }).join('');
    var stats = a.stats.map(function(s){
      return '<div class="s"><div class="n">'+esc(s.num)+'</div><div class="t">'+esc(s.label)+'</div></div>';
    }).join('');
    return ''+
    '<section class="about" id="about">'+
      '<div class="wrap about-grid">'+
        '<div class="about-portrait reveal"><img class="about-photo" src="assets/photo.jpeg" alt="'+esc(a.title)+' — Ziyang ZHAN" width="240" height="240"></div>'+
        '<div class="reveal" style="--d:.1s">'+
          '<span class="kicker" style="display:inline-block;font-family:\'Press Start 2P\';font-size:.68rem;background:var(--text);color:var(--bg);padding:9px 14px;border:3px solid var(--line);margin-bottom:16px;line-height:1.5;">'+esc(a.kicker)+'</span>'+
          '<h2>'+esc(a.title)+'</h2>'+
          paras+
          '<div class="about-stats">'+stats+'</div>'+
        '</div>'+
      '</div>'+
    '</section>';
  }

  function renderSkills(d){
    var s = d.skills;
    var axes = s.axes || [];
    var N = axes.length;
    // Responsive sizing: bigger on all screens, labels pushed outward
    var isMobile = window.innerWidth < 640;
    var cx = isMobile ? 160 : 240, cy = isMobile ? 160 : 240, r = isMobile ? 95 : 165;
    var viewSize = isMobile ? 320 : 480;
    function labelRadius(name){
      var extra = isMobile ? 18 : 36;
      // long labels pull inward slightly so they stay inside the SVG
      var len = name.length;
      if (isMobile && len > 6) extra -= (len - 6) * 3;
      if (isMobile && extra < 6) extra = 6;
      return r + extra;
    }
    var levels = 5;
    function rad(i){ return (Math.PI * 2 * i / N) - Math.PI / 2; }

    // Grid polygons + level labels
    var grid = [];
    for (var lv = 1; lv <= levels; lv++){
      var pts = [];
      for (var i = 0; i < N; i++){
        var a = rad(i), p = lv / levels;
        pts.push((cx + r * p * Math.cos(a)) + ',' + (cy + r * p * Math.sin(a)));
      }
      grid.push('<polygon points="'+pts.join(' ')+'" fill="none" stroke="rgba(232,233,239,0.10)" stroke-width="1" stroke-dasharray="3,4"/>');
    }
    // Axes (colored per axis)
    var axesSvg = [];
    for (var i = 0; i < N; i++){
      var a = rad(i);
      var col = esc(axes[i].color || 'var(--cyan)');
      axesSvg.push('<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+r*Math.cos(a))+'" y2="'+(cy+r*Math.sin(a))+'" stroke="'+col+'" stroke-width="1" stroke-opacity="0.25"/>');
    }

    // Data polygon (animated via CSS stroke-dasharray)
    var dpts = [];
    for (var i = 0; i < N; i++){
      var a = rad(i), p = axes[i].pct / 100;
      dpts.push((cx + r * p * Math.cos(a)) + ',' + (cy + r * p * Math.sin(a)));
    }
    var polyPoints = dpts.join(' ');
    var dataPoly = '<polygon class="radar-area" points="'+polyPoints+'" fill="rgba(34,211,238,0.10)" stroke="var(--cyan)" stroke-width="2" data-pts="'+polyPoints+'"/>';

    // Data dots + labels + hit areas (colored per axis)
    var dots = [], labels = [], hitAreas = [];
    for (var i = 0; i < N; i++){
      var a = rad(i), p = axes[i].pct / 100;
      var dx = cx + r * p * Math.cos(a), dy = cy + r * p * Math.sin(a);
      var lr = labelRadius(axes[i].name);
      var lx = cx + lr * Math.cos(a), ly = cy + lr * Math.sin(a);
      // anchor so text grows toward the chart center, never off-canvas
      var anchor = Math.cos(a) > 0.35 ? 'end' : (Math.cos(a) < -0.35 ? 'start' : 'middle');
      var col = esc(axes[i].color || 'var(--cyan)');
      var itemsJson = JSON.stringify(axes[i].items || []).replace(/"/g, '&quot;');
      dots.push('<circle class="radar-dot" cx="'+dx+'" cy="'+dy+'" r="5" fill="var(--bg)" stroke="'+col+'" stroke-width="2.5" data-axis="'+i+'"/>');
      labels.push('<text class="radar-label" x="'+lx+'" y="'+ly+'" text-anchor="'+anchor+'" dominant-baseline="middle" fill="'+col+'" data-axis="'+i+'">'+esc(axes[i].name)+'</text>');
      hitAreas.push('<circle cx="'+dx+'" cy="'+dy+'" r="14" fill="transparent" stroke="none" style="cursor:pointer;" data-axis="'+i+'" data-name="'+esc(axes[i].name)+'" data-pct="'+axes[i].pct+'" data-color="'+col+'" data-items="'+itemsJson+'"/>');
    }
    var radarSvg = ''+
      '<div class="radar-wrap reveal">'+
        '<svg viewBox="0 0 '+viewSize+' '+viewSize+'" class="radar-svg" role="img" aria-label="Skill radar chart">'+
          '<defs><filter id="radar-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>'+
          '<g>'+grid.join('')+'</g>'+
          '<g>'+axesSvg.join('')+'</g>'+
          dataPoly+
          '<g>'+dots.join('')+'</g>'+
          '<g>'+labels.join('')+'</g>'+
          '<g>'+hitAreas.join('')+'</g>'+
        '</svg>'+
      '</div>';

    return ''+
    '<section class="skills tex-stripes" id="skills">'+
      '<div class="wrap">'+
        '<div class="section-head reveal">'+
          '<span class="kicker">'+esc(s.kicker)+'</span>'+
          '<h2>'+esc(s.title)+'</h2>'+
          '<p>'+esc(s.desc)+'</p>'+
        '</div>'+
        radarSvg+
        '<div class="skill-detail" id="skillDetail"></div>'+
      '</div>'+
    '</section>';
  }

  function renderExp(d){
    var t = d.journey;
    var cp = d.current_proj;
    var overall = Math.round(cp.phases.reduce(function(sum, ph){ return sum + (ph.progress || 0); }, 0) / cp.phases.length);
    var hl = t.highlights || [];
    var items = t.items.map(function(it, i){
      var delay = (i*0.08).toFixed(2);
      var itemSkills = [];
      var projectsHtml = '';
      if (it.projects && it.projects.length){
        projectsHtml = '<div class="tl-subs">' + it.projects.map(function(sub){
          var subSkills = (sub.skills || []);
          itemSkills = itemSkills.concat(subSkills);
          var subSkillsAttr = subSkills.join(',');
          var descHtml = Array.isArray(sub.desc)
            ? '<ul class="tl-bullets">' + sub.desc.map(function(d){ return '<li>'+richWithHL(d, hl)+'</li>'; }).join('') + '</ul>'
            : '<p>'+richWithHL(sub.desc, hl)+'</p>';
          return ''+
          '<div class="tl-sub" data-skills="'+esc(subSkillsAttr)+'">'+
            '<span class="tl-sub-dot" aria-hidden="true"></span>'+
            '<div>'+
              '<h4>'+rich(sub.proj)+'</h4>'+
              descHtml+
            '</div>'+
          '</div>';
        }).join('') + '</div>';
      }
      var uniqueItemSkills = itemSkills.filter(function(s, idx, arr){ return arr.indexOf(s) === idx; }).join(',');
      return ''+
      '<div class="tl-item reveal" data-skills="'+esc(uniqueItemSkills)+'" style="--d:'+delay+'s">'+
        '<span class="tl-dot" aria-hidden="true"></span>'+
        '<div class="tl-card">'+
          '<span class="yr">'+esc(it.year)+'</span>'+
          '<h3>'+rich(it.role)+'</h3>'+
          (it.place ? '<div class="tl-place">'+rich(it.place)+'</div>' : '')+
          '<div class="co">'+rich(it.company)+'</div>'+
          '<p>'+richWithHL(it.desc, hl)+'</p>'+
          projectsHtml+
        '</div>'+
      '</div>';
    }).join('');

    var tabs =
      '<button class="exp-tab active" data-tab="timeline" role="tab" aria-selected="true">Journey</button>'+
      '<button class="exp-tab exp-tab--live" data-tab="current" role="tab" aria-selected="false">Building</button>';

    var phases = cp.phases.map(function(ph, i){
      var delay = (i*0.06).toFixed(2);
      var hereBadge = ph.status === 'in-progress' ? '<span class="phase-here">You are here</span>' : '';
      return ''+
      '<div class="phase-tl-item reveal status-'+esc(ph.status)+'" style="--d:'+delay+'s">'+
        '<span class="phase-tl-dot" aria-hidden="true"></span>'+
        '<div class="phase-tl-card">'+
          '<div class="phase-tl-head">'+
            '<h4>'+esc(ph.name)+'</h4>'+
            '<span class="phase-status">'+esc(ph.status)+'</span>'+
            '<span class="phase-date mono">'+esc(ph.date)+'</span>'+
          '</div>'+
          '<p>'+esc(ph.desc)+'</p>'+
          '<div class="bar"><div class="bar-fill c'+((i%5)+1)+'" data-width="'+esc(ph.progress)+'%"></div></div>'+
          '<span class="phase-pct mono">'+esc(ph.progress)+'%</span>'+
          hereBadge+
        '</div>'+
      '</div>';
    }).join('');

    var githubRepoLink = cp.github_repo ? '<a class="overall-github" href="'+esc(cp.github_repo)+'" target="_blank" rel="noopener" aria-label="View on GitHub"><img src="assets/contact-github.svg" alt="GitHub" width="18" height="18"></a>' : '';

    var currentPanel = ''+
    '<div class="current-intro reveal">'+
      '<h3>'+esc(cp.title)+'</h3>'+
      '<p>'+esc(cp.desc)+'</p>'+
      '<div class="current-meta">'+
        '<span class="mono">Started: '+esc(cp.startDate)+'</span>'+
        '<span class="mono">Overall: '+esc(overall)+'%</span>'+
        githubRepoLink+
      '</div>'+
      '<div class="bar overall-bar"><div class="bar-fill c1" data-width="'+esc(overall)+'%"></div></div>'+
    '</div>'+
    '<div class="phase-timeline">'+
      '<div class="phase-tl-line" aria-hidden="true"></div>'+
      '<div class="phase-tl-item start reveal">'+
        '<span class="phase-tl-dot" aria-hidden="true"></span>'+
        '<div class="phase-tl-card">'+
          '<span class="phase-date mono">'+esc(cp.startDate)+'</span>'+
          '<h4>Project started</h4>'+
        '</div>'+
      '</div>'+
      phases+
    '</div>';

    return ''+
    '<section class="timeline tex-dots" id="journey">'+
      '<div class="wrap">'+
        '<div class="section-head reveal" style="text-align:center;">'+
          '<span class="kicker">'+esc(t.kicker)+'</span>'+
          '<h2>'+esc(t.title)+'</h2>'+
        '</div>'+
        '<div class="exp-tabs" role="tablist">'+tabs+'</div>'+
        '<div class="exp-panel active" id="tab-panel-timeline">'+
          '<div class="tl">'+items+'</div>'+
        '</div>'+
        '<div class="exp-panel" id="tab-panel-current">'+currentPanel+'</div>'+
      '</div>'+
    '</section>';
  }

  function renderContact(d){
    var c = d.contact;
    return ''+
    '<section class="contact" id="contact">'+
      '<div class="wrap">'+
        '<div class="contact-box tex-noise reveal">'+
          '<img class="mario" id="mario" src="assets/contact-mario.svg" width="45" height="60" alt="Pixel Mario" aria-hidden="true">'+
          '<div class="mario-bubble" id="marioBubble" aria-hidden="true"></div>'+
          '<img class="mushroom" id="mushroom" src="assets/contact-mushroom.svg" width="40" height="40" alt="" aria-hidden="true">'+
          '<h2>'+esc(c.title)+'</h2>'+
          '<p>'+rich(c.desc)+'</p>'+
          '<div class="contact-cards">'+
            '<a href="mailto:'+esc(c.email)+'" class="ctc-card ctc--email">'+
              '<img class="ctc-icon" src="assets/contact-email.svg" width="28" height="28" alt="" aria-hidden="true">'+
              '<span class="ctc-label">Email</span>'+
              '<span class="ctc-val">'+esc(c.email)+'</span>'+
            '</a>'+
            '<a href="'+esc(c.linkedin)+'" target="_blank" rel="noopener" class="ctc-card ctc--linkedin">'+
              '<img class="ctc-icon" src="assets/contact-linkedin.svg" width="28" height="28" alt="" aria-hidden="true">'+
              '<span class="ctc-label">LinkedIn</span>'+
              '<span class="ctc-val">Let\'s connect</span>'+
            '</a>'+
            '<a href="'+esc(c.resume)+'" target="_blank" download class="ctc-card ctc--resume">'+
              '<img class="ctc-icon" src="assets/contact-resume.svg" width="28" height="28" alt="" aria-hidden="true">'+
              '<span class="ctc-label">Resume</span>'+
              '<span class="ctc-val">Download Resume</span>'+
            '</a>'+
            '<a href="'+esc(c.github)+'" target="_blank" rel="noopener" class="ctc-card ctc--github">'+
              '<img class="ctc-icon" src="assets/contact-github.svg" width="28" height="28" alt="" aria-hidden="true">'+
              '<span class="ctc-label">GitHub</span>'+
              '<span class="ctc-val">zizi1noob.github.io</span>'+
            '</a>'+
          '</div>'+
        '</div>'+
      '</div>'+
    '</section>';
  }

  function renderFooter(d){
    var f = d.footer;
    return ''+
    '<div class="wrap">'+
      '<div class="foot-center">'+
        '<a href="#about" class="foot-name">'+esc(d.site)+'</a>'+
        '<p class="foot-slogan mono">'+rich(f.slogan)+'</p>'+
        '<p class="foot-built">'+esc(f.bottom)+'</p>'+
      '</div>'+
    '</div>';
  }

  /* ---------- init interactions after render ---------- */
  function initInteractions(d){
    // mobile nav toggle (delegated, survives re-render)
    var toggle = document.getElementById('navToggle');
    var links  = document.getElementById('navLinks');
    toggle.addEventListener('click', function(){
      var open = links.classList.toggle('open');
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    links.addEventListener('click', function(e){
      if (e.target.tagName === 'A'){
        links.classList.remove('open');
        toggle.setAttribute('aria-expanded','false');
      }
    });
    document.addEventListener('keydown', function(e){
      if (e.key === 'Escape' && links.classList.contains('open')){
        links.classList.remove('open');
        toggle.setAttribute('aria-expanded','false');
        toggle.focus();
      }
    });

    // scroll reveal + progress bars
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var reveals = document.querySelectorAll('.reveal');
    var bars = document.querySelectorAll('.bar-fill');
    function fillBars(scope){
      scope.querySelectorAll('.bar-fill').forEach(function(b){
        b.style.width = b.getAttribute('data-width');
      });
    }
    if (reduce || !('IntersectionObserver' in window)){
      reveals.forEach(function(el){ el.classList.add('in-view'); });
      bars.forEach(function(b){ b.style.width = b.getAttribute('data-width'); });
    } else {
      var io = new IntersectionObserver(function(entries){
        entries.forEach(function(entry){
          if (entry.isIntersecting){
            entry.target.classList.add('in-view');
            fillBars(entry.target);
            io.unobserve(entry.target);
          }
        });
      }, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });
      reveals.forEach(function(el){ io.observe(el); });
    }

    // experience / current project tabs
    function switchExpTab(id){
      document.querySelectorAll('.exp-tab').forEach(function(b){
        var active = b.dataset.tab === id;
        b.classList.toggle('active', active);
        b.setAttribute('aria-selected', active ? 'true' : 'false');
      });
      document.querySelectorAll('.exp-panel').forEach(function(p){
        var active = p.id === 'tab-panel-' + id;
        p.classList.toggle('active', active);
        if (active) fillBars(p);
      });
    }
    document.querySelectorAll('.exp-tab').forEach(function(btn){
      btn.addEventListener('click', function(){ switchExpTab(btn.dataset.tab); });
    });

    // skill cloud → filter / highlight timeline projects
    // radar interactions: tooltip + detail panel + highlight
    var radarWrap = document.querySelector('.radar-wrap');
    var radarTip = document.createElement('div');
    radarTip.className = 'radar-tip';
    if (radarWrap) radarWrap.appendChild(radarTip);

    function showRadarTip(el, axisName, pct, items, color){
      if (!radarTip) return;
      var html = '<strong style="color:'+esc(color)+'">'+esc(axisName)+' <span class="rt-pct mono">'+pct+'%</span></strong><ul>'+(items || []).map(function(it){ return '<li>'+esc(it)+'</li>'; }).join('')+'</ul>';
      radarTip.innerHTML = html;
      // make visible off-screen first so dimensions can be measured
      radarTip.style.visibility = 'hidden';
      radarTip.classList.add('show');
      var rect = el.getBoundingClientRect();
      var wrapRect = radarWrap.getBoundingClientRect();
      var tipW = radarTip.offsetWidth, tipH = radarTip.offsetHeight;
      var tipX = rect.left - wrapRect.left + rect.width/2 - tipW/2;
      var tipY = rect.top - wrapRect.top - tipH - 10;
      if (tipY < 0) tipY = rect.top - wrapRect.top + rect.height + 10;
      radarTip.style.left = Math.max(0, Math.min(tipX, wrapRect.width - tipW)) + 'px';
      radarTip.style.top = tipY + 'px';
      radarTip.style.visibility = 'visible';
    }
    function hideRadarTip(){
      if (radarTip) radarTip.classList.remove('show');
    }

    function buildSkillDetail(axisName, pct, color, items){
      var detail = document.getElementById('skillDetail');
      if (!detail) return;
      // find matching projects across timeline
      var matches = [];
      d.timeline.items.forEach(function(item){
        (item.projects || []).forEach(function(proj){
          var projSkills = proj.skills || [];
          var matchedSkills = [];
          items.forEach(function(sk){ if (projSkills.indexOf(sk) !== -1) matchedSkills.push(sk); });
          if (matchedSkills.length){
            matches.push({
              company: item.company, year: item.year, role: item.role,
              proj: proj.proj, desc: proj.desc, skills: matchedSkills
            });
          }
        });
      });
      var cards = matches.map(function(m){
        var descHtml = Array.isArray(m.desc)
          ? '<ul class="sd-bullets">' + m.desc.map(function(d){ return '<li>'+richWithHL(d, hl)+'</li>'; }).join('') + '</ul>'
          : '<p>'+richWithHL(m.desc, hl)+'</p>';
        var skillTags = m.skills.map(function(sk){ return '<span class="sd-tag">'+esc(sk)+'</span>'; }).join('');
        return ''+
        '<article class="sd-card">'+
          '<div class="sd-meta">'+esc(m.year)+' · '+rich(m.company)+'</div>'+
          '<h4>'+rich(m.proj)+'</h4>'+
          descHtml+
          '<div class="sd-tags">'+skillTags+'</div>'+
        '</article>';
      }).join('');
      var header = '<div class="sd-header"><span class="sd-dot" style="background:'+esc(color)+'"></span><strong>'+esc(axisName)+'</strong> <span class="sd-pct mono">'+pct+'%</span></div>';
      detail.innerHTML = header + (cards ? '<div class="sd-grid">'+cards+'</div>' : '<p class="sd-empty">No matching projects in timeline.</p>');
      detail.classList.add('show');
      detail.scrollIntoView({behavior: 'smooth', block: 'nearest'});
    }
    function clearSkillDetail(){
      var detail = document.getElementById('skillDetail');
      if (detail){ detail.classList.remove('show'); detail.innerHTML = ''; }
      document.querySelectorAll('.radar-dot, .radar-label').forEach(function(el){ el.classList.remove('active'); });
    }

    document.querySelectorAll('.radar-svg circle[data-axis]').forEach(function(hit){
      var axisIdx = hit.dataset.axis;
      hit.addEventListener('mouseenter', function(){
        showRadarTip(hit, hit.dataset.name, hit.dataset.pct, JSON.parse(hit.dataset.items || '[]'), hit.dataset.color);
        document.querySelectorAll('.radar-dot[data-axis="'+axisIdx+'"], .radar-label[data-axis="'+axisIdx+'"]').forEach(function(el){ el.classList.add('active'); });
      });
      hit.addEventListener('mouseleave', function(){
        hideRadarTip();
        document.querySelectorAll('.radar-dot[data-axis="'+axisIdx+'"], .radar-label[data-axis="'+axisIdx+'"]').forEach(function(el){ el.classList.remove('active'); });
      });
      hit.addEventListener('click', function(e){
        e.stopPropagation();
        buildSkillDetail(hit.dataset.name, hit.dataset.pct, hit.dataset.color, JSON.parse(hit.dataset.items || '[]'));
      });
    });
    document.addEventListener('click', function(e){
      if (!e.target.closest('.radar-svg') && !e.target.closest('#skillDetail')){
        clearSkillDetail();
      }
    });

    // weapon arsenal for the floating scroll-to-top button
    var WEAPONS = [
      { name: 'axe', src: 'assets/weapon-axe.svg' },
      { name: 'sword', src: 'assets/weapon-sword.svg' },
      { name: 'blade', src: 'assets/weapon-blade.svg' },
      { name: 'spear', src: 'assets/weapon-spear.svg' },
      { name: 'staff', src: 'assets/weapon-staff.svg' },
    ];
    WEAPONS.forEach(function(w){ var _i = new Image(); _i.src = w.src; });

    var SPARK_COLORS = ['#00E5FF','#FF1493','#FFCB2E','#7CFF4F','#B388FF','#FB923C'];

    // Mario: hover a contact card → slide under it; click → jump up to bonk that card.
    // Jump height is computed from the card's real position (accounting for Mario's
    // own height) plus a little extra so his head pokes under the box.
    var _mario = document.getElementById('mario');
    var _mushroom = document.getElementById('mushroom');
    var _bubble = document.getElementById('marioBubble');
    var _box = document.querySelector('.contact-box');
    var _cards = document.querySelectorAll('.ctc-card');
    if (_mario && _mushroom && _box && _cards.length){
      var _wrap = document.querySelector('.contact-cards');

      // align Mario (horizontal) + mushroom (column + start height) + speech bubble to a card
      function alignToCard(card){
        var br = _box.getBoundingClientRect();
        var cr = card.getBoundingClientRect();
        var x = cr.left + cr.width / 2 - br.left;     // px from box left
        _mario.style.left = x + 'px';
        if (_bubble) _bubble.style.left = x + 'px';
        _mushroom.style.setProperty('--mLeft', (x / br.width * 100) + '%');
        _mushroom.style.setProperty('--mTop', (cr.top - br.top) + 'px');   // emerge from the card
        _mushroom.style.setProperty('--mFloor', (br.height - 50) + 'px');  // land near the floor (beside Mario)
      }
      function resetAlign(){
        _mario.style.left = '50%';
        if (_bubble){ _bubble.style.left = '50%'; hideBubble(); }
        _mushroom.style.setProperty('--mLeft', '50%');
        _mushroom.style.setProperty('--mTop', '-60px');
      }
      // speech bubble helpers
      var BUBBLE_TEXTS = {
        email:    ['Sending...', 'You\'ve got mail!', 'Ping!', 'Email incoming'],
        linkedin: ['Connecting...', 'Let\'s network!', 'Linking...', 'Hello there'],
        resume:   ['Downloading...', 'Hiring?', 'Resume ready', 'Grab it!'],
        github:   ['Coding...', 'Star me!', 'Repo time', 'To the code'],
        default:  ['Loading...', 'Bonk!', 'Jump!', 'Here we go!', 'Wait for it...']
      };
      function randomText(card){
        var key = 'default';
        if (card.classList.contains('ctc--email')) key = 'email';
        else if (card.classList.contains('ctc--linkedin')) key = 'linkedin';
        else if (card.classList.contains('ctc--resume')) key = 'resume';
        else if (card.classList.contains('ctc--github')) key = 'github';
        var arr = BUBBLE_TEXTS[key];
        return arr[Math.floor(Math.random() * arr.length)];
      }
      function showBubble(card){
        if (!_bubble) return;
        _bubble.textContent = randomText(card);
        _bubble.classList.add('show');
      }
      function hideBubble(){
        if (!_bubble) return;
        _bubble.classList.remove('show');
      }
      // computed jump so Mario's head reaches the card's bottom + a small overlap
      function computeJump(card){
        var br = _box.getBoundingClientRect();
        var cr = card.getBoundingClientRect();
        var marioH = _mario.offsetHeight || 60;
        var overlap = 14; // 额外余量：让头略微顶进盒子
        var D = (br.bottom - cr.bottom) - marioH + overlap;
        if (D < 36) D = 36; // 最小可见跳跃
        return D;
      }
      function bonk(card){
        alignToCard(card);
        _mario.style.setProperty('--jump', '-' + computeJump(card) + 'px');
        _mario.classList.remove('jump');
        void _mario.offsetWidth;          // reflow → restart animation
        _mario.classList.add('jump');
        setTimeout(function(){            // mushroom drops after Mario hits peak
          _mushroom.classList.remove('go');
          void _mushroom.offsetWidth;
          _mushroom.classList.add('go');
        }, 350);
      }

      // perform a card's real navigation (mailto / new-tab / download) exactly as the
      // original <a> would, by cloning it and clicking — so href/download/rel are kept.
      // A link that has BOTH target=_blank and download is treated as download-only
      // (no extra tab) to avoid opening two things at once.
      function triggerLink(el){
        var a = document.createElement('a');
        a.href = el.href;
        if (el.rel) a.rel = el.rel;
        if (el.hasAttribute('download')){
          a.setAttribute('download', el.getAttribute('download') || '');
        } else if (el.target){
          a.target = el.target;        // new-tab links open a single tab
        }
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }

      // Defuse the native <a> navigation so the card cannot open its link by itself.
      // The real link data is stored on the element and only triggered once, after the
      // Mario jump + mushroom animation has played. This guarantees exactly one tab,
      // download, or mail client opens, never two.
      function openCardLink(card){
        var href = card.dataset.href;
        if (!href) return;
        if (card.dataset.download !== undefined){            // Resume: download
          var a = document.createElement('a');
          a.href = href;
          a.setAttribute('download', card.dataset.download);
          if (card.dataset.rel) a.rel = card.dataset.rel;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        } else if (card.dataset.target === '_blank'){        // LinkedIn / GitHub: new tab
          var win = window.open(href, '_blank');
          if (win) win.opener = null;
        } else {                                             // Email: mailto
          window.location.href = href;
        }
      }

      _cards.forEach(function(card){
        // Store original link data, then remove the native link attributes so the card
        // is no longer a real navigable anchor while we animate.
        card.dataset.href = card.href;
        if (card.target) card.dataset.target = card.target;
        if (card.rel) card.dataset.rel = card.rel;
        if (card.hasAttribute('download')){
          card.dataset.download = card.getAttribute('download') || '';
        }
        card.removeAttribute('href');
        card.removeAttribute('target');
        card.removeAttribute('download');
        card.removeAttribute('rel');
        card.setAttribute('role', 'link');
        card.setAttribute('tabindex', '0');

        card.addEventListener('mouseenter', function(){ alignToCard(card); });
        card.addEventListener('click', function(e){
          e.preventDefault();
          e.stopImmediatePropagation(); // extra safety: no duplicate handler can fire
          if (card.dataset.busy) return;   // ignore extra clicks during the wait
          card.dataset.busy = '1';
          showBubble(card);            // Mario says something while jumping
          bonk(card);                  // play Mario jump + mushroom pop first
          // wait so the jump is clearly visible, THEN do the real action (exactly once)
          setTimeout(function(){
            openCardLink(card);
            card.dataset.busy = '';
          }, 900);
          // keep the bubble visible a little longer, then clear it
          setTimeout(function(){ hideBubble(); }, 1500);
        }, true);                      // capture phase: prevents any default leakage
      });
      if (_wrap) _wrap.addEventListener('mouseleave', resetAlign);
      _mushroom.addEventListener('animationend', function(){ _mushroom.classList.remove('go'); });
    }

    // floating scroll-to-top button: click = back to top + cycle weapon + shake + sparks
    var _ftBadge = document.getElementById('floatTop');
    if (_ftBadge){
      var _ftImg = _ftBadge.querySelector('img');
      var _ftIdx  = 0;

      function explode(el){
        var N = 28;
        for (var i = 0; i < N; i++){
          var p = document.createElement('span');
          p.className = 'spark';
          var ang  = Math.random() * Math.PI * 2;
          var dist = 14 + Math.random() * 28;
          var size = 3 + Math.floor(Math.random() * 4);
          p.style.setProperty('--tx', (Math.cos(ang) * dist).toFixed(1) + 'px');
          p.style.setProperty('--ty', (Math.sin(ang) * dist).toFixed(1) + 'px');
          p.style.setProperty('--sz', size + 'px');
          p.style.background = SPARK_COLORS[i % SPARK_COLORS.length];
          p.style.animationDelay = (Math.random() * 0.06).toFixed(3) + 's';
          p.style.animationDuration = (0.4 + Math.random() * 0.3).toFixed(2) + 's';
          el.appendChild(p);
          p.addEventListener('animationend', function(){ p.remove(); });
        }
        var ring = document.createElement('span');
        ring.className = 'spark-ring';
        el.appendChild(ring);
        ring.addEventListener('animationend', function(){ ring.remove(); });
      }

      _ftBadge.addEventListener('click', function(){
        window.scrollTo({ top: 0, behavior: 'smooth' });
        _ftIdx = (_ftIdx + 1) % WEAPONS.length;
        var w = WEAPONS[_ftIdx];
        _ftImg.src = w.src;
        _ftImg.alt = w.name;
        _ftBadge.setAttribute('aria-label', 'Back to top · ' + w.name);

        // snap weapon upright, then resume chopping
        _ftImg.classList.add('reset');
        setTimeout(function(){ _ftImg.classList.remove('reset'); }, 420);

        // explosion sparks
        explode(_ftBadge);

        // screen shake
        document.body.classList.remove('shake');
        void document.body.offsetWidth;
        document.body.classList.add('shake');
        document.body.addEventListener('animationend', function(){
          document.body.classList.remove('shake');
        }, { once: true });

        // flash
        _ftBadge.classList.remove('flash');
        void _ftBadge.offsetWidth;
        _ftBadge.classList.add('flash');
        _ftBadge.addEventListener('animationend', function(){
          _ftBadge.classList.remove('flash');
        }, { once: true });
      });
    }
  }

  /* ---------- boot ---------- */
  function boot(d){
    // bust CSS cache using version from data.json
    var ss = document.querySelector('link[href="style.css"]');
    if (ss && d.version) ss.href = 'style.css?v=' + d.version;
    renderNav(d);
    document.getElementById('aboutMount').innerHTML = renderAbout(d);
    document.getElementById('timelineMount').innerHTML = renderExp(d);
    document.getElementById('skillsMount').innerHTML = renderSkills(d);
    document.getElementById('contactMount').innerHTML = renderContact(d);
    document.getElementById('footerMount').innerHTML = renderFooter(d);
    initInteractions(d);
  }

  function showError(msg){
    var b = document.getElementById('errorBanner');
    b.classList.add('show');
    b.innerHTML =
      '<img class="err-ico" src="assets/err-icon.svg" width="44" height="44" alt="" aria-hidden="true">'+
      '<div class="err-body">'+msg+'</div>'+
      '<img class="err-float err-float--1" src="assets/err-star.svg" width="22" height="22" alt="" aria-hidden="true">'+
      '<img class="err-float err-float--2" src="assets/err-dot.svg" width="14" height="14" alt="" aria-hidden="true">';
  }

  function fetchData(){
    fetch('./assets/data.json', { cache: 'no-store' })
      .then(function(r){
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function(d){ boot(d); })
      .catch(function(err){
        showError(' Could not load <code>assets/data.json</code> — the site needs this file to render. ');
      });
  }
  fetchData();
})();
</script>
<button class="float-top" id="floatTop" aria-label="Back to top">
  <img src="assets/weapon-sword.svg" alt="" width="28" height="28" aria-hidden="true">
</button>
</body>
</html>
